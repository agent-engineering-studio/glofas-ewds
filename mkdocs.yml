site_name: glofas-ewds
site_description: "GloFAS river discharge and the Copernicus Fire Weather Index from the EWDS, read on the right grid cell"
site_url: https://agentengineering.it/glofas-ewds/
repo_url: https://github.com/agent-engineering-studio/glofas-ewds
repo_name: agent-engineering-studio/glofas-ewds
edit_uri: edit/main/docs/
copyright: "Code Apache-2.0. GloFAS and fire danger data: Copernicus Emergency Management Service, under the CEMS-FLOODS and dataset licences. Not a flood warning."

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      toggle: {icon: material/weather-sunny, name: Light mode}

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets: {base_path: ["."], check_paths: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  make_images.py

nav:
  - Home: index.md
  - API reference:
      - Cells: api/cells.md
      - Requests: api/request.md
      - Downloads: api/download.md
      - Client: api/client.md
      - GloFAS readers: api/glofas.md
      - Fire danger (FWI): api/fwi.md
      - Reference and ratio: api/reference.md
      - Errors: api/errors.md
  - Changelog: changelog.md
  - Contributing: contributing.md

validation:
  links:
    not_found: info
    unrecognized_links: info
